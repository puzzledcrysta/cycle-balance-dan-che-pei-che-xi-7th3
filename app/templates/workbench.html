<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单车配车席</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/dispatch.css">
  <script type="module" src="/static/workspace.js"></script>
  <script type="module" src="/static/handover.js"></script>
</head>
<body class="dispatch">
  <div class="workbench">
    <aside class="rail">
      <a class="brand" href="/"><span aria-hidden="true">⇄</span><b>单车配车席</b></a>
      <nav aria-label="业务模块">
        {% for slug, label in tabs.items() %}<a href="#{{ slug }}" data-module="{{ slug }}">{{ label }}</a>{% endfor %}
      </nav>
      <small>共享单车晨班调度员</small>
    </aside>
    <div class="desk">
      <header class="toolbar"><span>调车区</span><span class="edition">规则 1.0</span><a class="btn" id="export" hidden>导出证据</a></header>
      <main>
        <section class="mast"><h1>单车配车席</h1><div class="clock"><small>车辆运营</small><time id="created"></time></div></section>
        <ul class="kpis" aria-label="批次指标"><li class="kpi"><small>有效</small><strong data-count="accepted">—</strong><span>条</span></li>
<li class="kpi"><small>隔离</small><strong data-count="rejected">—</strong><span>条</span></li>
<li class="kpi"><small>账差</small><strong data-count="mismatched">—</strong><span>条</span></li>
<li class="kpi"><small>净差</small><strong data-count="delta">—</strong><span>车公里</span></li>
<li class="kpi"><small>来源记录</small><strong data-count="input">—</strong><span>条</span></li>
        </ul>
        <div class="grid">
    <section class="panel source" aria-labelledby="input-title">
      <div class="panel__head"><h2 id="input-title">调配凭单</h2><small>CSV</small></div>
      <form id="source" class="panel__body">
        <div class="actions"><button type="submit" class="btn btn--primary">运行调度流量</button>
        <button type="button" id="sample" class="btn">载入样例</button></div>
        <details><summary>导入来源与外部账</summary>
          <label>来源文件 <input id="source-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="source-csv" aria-label="原始记录 CSV" rows="4"></textarea>
          <label>外部账 <input id="book-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="book-csv" aria-label="外部账 CSV" rows="4"></textarea>
        </details>
        <output id="notice" role="status"></output>
      </form>
    </section>

    <section class="panel results" aria-labelledby="phase">
      <div class="panel__head"><h2 id="phase">调度流量</h2><span class="num" id="run-id"></span></div>
      <div id="tools" class="filters" hidden><label>筛选 <input id="filter" type="search" placeholder="调车区 / 原因" maxlength="80"></label>
        <label id="only-differences" hidden><input id="differences" type="checkbox"> 只看差异</label><output id="shown"></output></div>
      <div class="scroll" id="grid-data"><p class="empty">运行本班样例</p></div>
      <form id="review" class="panel__body" hidden>
        <label>复核意见 <textarea id="review-note" maxlength="500" rows="2"></textarea></label>
        <div class="actions"><label>结论 <select id="decision"><option>确认</option><option>退回</option></select></label>
        <button class="btn btn--primary" type="submit">提交复核</button></div>
      </form>
    </section>

    <article class="panel signal" id="evidence-panel" data-instrument="route">
      <div class="panel__head"><h2>真实调车路由</h2><span class="num" id="evidence-key"></span></div>
      <div class="panel__body" id="signal" aria-live="polite"><p class="empty">选择一条复算记录</p></div>
    </article></div>
    <div class="grid" id="handover-desk" hidden>
      <section class="panel source" aria-labelledby="handover-input-title">
        <div class="panel__head"><h2 id="handover-input-title">交接输入</h2><small>期初 / 发车 / 事件</small></div>
        <form id="handover-form" class="panel__body">
          <div class="actions"><button type="submit" class="btn btn--primary">生成交接单</button>
          <button type="button" id="handover-sample" class="btn">载入交接样例</button></div>
          <details open><summary>三份交接 CSV 与截止时刻</summary>
            <label>期初余额 <input id="ho-opening-file" type="file" accept=".csv,text/csv"></label>
            <textarea id="ho-opening" aria-label="期初余额 CSV" rows="3"></textarea>
            <label>发车单 <input id="ho-departure-file" type="file" accept=".csv,text/csv"></label>
            <textarea id="ho-departure" aria-label="发车单 CSV" rows="4"></textarea>
            <label>到达/取消事件 <input id="ho-event-file" type="file" accept=".csv,text/csv"></label>
            <textarea id="ho-event" aria-label="事件 CSV" rows="4"></textarea>
            <label>交接截止时刻（留空按最早发车日 07:00 +08:00）
              <input id="ho-cutoff" type="text" placeholder="2026-11-20T07:00:00+08:00"></label>
          </details>
          <output id="ho-notice" role="status"></output>
        </form>
      </section>
      <section class="panel results" aria-labelledby="handover-phase">
        <div class="panel__head"><h2 id="handover-phase">班次交接单</h2><span class="num" id="ho-id"></span></div>
        <div class="filters" id="ho-tabs">
          <button type="button" class="btn ho-view" data-view="zones" aria-pressed="true">分区余缺</button>
          <button type="button" class="btn ho-view" data-view="trips" aria-pressed="false">车辆状态</button>
          <button type="button" class="btn ho-view" data-view="stations" aria-pressed="false">站点余额</button>
          <button type="button" class="btn ho-view" data-view="issues" aria-pressed="false">隔离与晚到</button>
        </div>
        <div class="scroll" id="ho-grid"><p class="empty">生成后下一班可照此派车</p></div>
      </section>
      <article class="panel signal" id="ho-summary-panel">
        <div class="panel__head"><h2>交接口径</h2><span class="num" id="ho-cutoff-label"></span></div>
        <div class="panel__body" id="ho-summary" aria-live="polite"><p class="empty">确认与预测分列，不混算</p></div>
      </article>
    </div>
      </main>
      <footer class="statusbar"><span id="state" role="status">等待输入</span><a href="/openapi.json">接口</a><span>UTC</span></footer>
    </div>
  </div>
  <script type="application/json" id="settings">{{ {'reasons': reasons, 'tabs': tabs, 'unit': unit, 'key': key}|tojson }}</script>
</body>
</html>
